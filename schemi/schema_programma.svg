<svg xmlns="http://www.w3.org/2000/svg" width="890" height="1132" font-family="Helvetica, Arial, sans-serif"><defs><marker id="fr" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="155.0" y="108" width="715.0" height="772" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="8 6"/><text x="866" y="100" font-size="17" text-anchor="end">Programma del modello (Algoritmi 4.1–4.7)</text><rect x="195.0" y="20" width="330" height="66" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="360.0" y="48.6" font-size="16" text-anchor="middle">Dati in ingresso</text><text x="360.0" y="68.6" font-size="16" text-anchor="middle">λ, μ, K₁, K₂</text><rect x="195.0" y="126" width="330" height="66" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="360.0" y="144.6" font-size="16" text-anchor="middle">Generazione degli stati</text><text x="360.0" y="164.6" font-size="16" text-anchor="middle">lista S degli n stati</text><text x="360.0" y="184.6" font-size="16" text-anchor="middle">(Algoritmo 4.1)</text><rect x="195.0" y="216" width="330" height="66" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="360.0" y="234.6" font-size="16" text-anchor="middle">Costruzione della matrice generatrice</text><text x="360.0" y="254.6" font-size="16" text-anchor="middle">Q e tabella simbolica T</text><text x="360.0" y="274.6" font-size="16" text-anchor="middle">(Algoritmo 4.2)</text><rect x="195.0" y="306" width="330" height="66" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="360.0" y="324.6" font-size="16" text-anchor="middle">Passo e matrice di transizione</text><text x="360.0" y="344.6" font-size="16" text-anchor="middle">h e P(h) = I + Q h</text><text x="360.0" y="364.6" font-size="16" text-anchor="middle">(Algoritmo 4.3)</text><polygon points="360.0,396 510.0,444.0 360.0,492 210.0,444.0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="360.0" y="429.6" font-size="16" text-anchor="middle">Controlli 1 e 2</text><text x="360.0" y="449.6" font-size="16" text-anchor="middle">superati?</text><text x="360.0" y="469.6" font-size="16" text-anchor="middle">(Algoritmo 4.4)</text><rect x="195.0" y="526" width="330" height="66" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="360.0" y="544.6" font-size="16" text-anchor="middle">Convergenza</text><text x="360.0" y="564.6" font-size="16" text-anchor="middle">p(n) = p(n − 1) P(h) fino a π</text><text x="360.0" y="584.6" font-size="16" text-anchor="middle">(Algoritmo 4.5)</text><rect x="195.0" y="616" width="330" height="66" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="360.0" y="634.6" font-size="16" text-anchor="middle">Indici di prestazione</text><text x="360.0" y="654.6" font-size="16" text-anchor="middle">P<tspan baseline-shift="sub" font-size="11">rif</tspan>, λ<tspan baseline-shift="sub" font-size="11">eff</tspan>, X, P(M1 bloccata), L, W</text><text x="360.0" y="674.6" font-size="16" text-anchor="middle">(Algoritmo 4.6)</text><rect x="195.0" y="706" width="330" height="66" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="360.0" y="724.6" font-size="16" text-anchor="middle">Controlli 3 e 4</text><text x="360.0" y="744.6" font-size="16" text-anchor="middle">esito salvato in output</text><text x="360.0" y="764.6" font-size="16" text-anchor="middle">(Algoritmo 4.7)</text><rect x="195.0" y="796" width="330" height="66" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="360.0" y="824.6" font-size="16" text-anchor="middle">Risultati della configurazione</text><text x="360.0" y="844.6" font-size="16" text-anchor="middle">π, indici, esito dei controlli</text><polygon points="360.0,906 510.0,954.0 360.0,1002 210.0,954.0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="360.0" y="939.6" font-size="16" text-anchor="middle">Tutti i controlli</text><text x="360.0" y="959.6" font-size="16" text-anchor="middle">superati?</text><text x="360.0" y="979.6" font-size="16" text-anchor="middle">(Algoritmo 4.8)</text><rect x="195.0" y="1036" width="330" height="66" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="360.0" y="1054.6" font-size="16" text-anchor="middle">Salvataggio degli indici</text><text x="360.0" y="1074.6" font-size="16" text-anchor="middle">configurazione successiva</text><text x="360.0" y="1094.6" font-size="16" text-anchor="middle">(Algoritmo 4.8)</text><polyline points="360,86 360,126" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><polyline points="360,192 360,216" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><polyline points="360,282 360,306" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><polyline points="360,372 360,396" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><polyline points="360,492 360,526" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><text x="376" y="512" font-size="16" text-anchor="middle">sì</text><polyline points="360,592 360,616" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><polyline points="360,682 360,706" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><polyline points="360,772 360,796" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><polyline points="360,862 360,906" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><polyline points="360,1002 360,1036" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><text x="376" y="1022" font-size="16" text-anchor="middle">sì</text><rect x="640" y="662.0" width="210" height="74" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="745.0" y="684.6" font-size="16" text-anchor="middle">Arresto del calcolo</text><text x="745.0" y="704.6" font-size="16" text-anchor="middle">con segnalazione</text><text x="745.0" y="724.6" font-size="16" text-anchor="middle">dell'errore</text><polyline points="510.0,444.0 745.0,444.0 745.0,662.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><text x="534.0" y="436.0" font-size="16" text-anchor="middle">no</text><polyline points="510.0,954.0 745.0,954.0 745.0,736.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><text x="534.0" y="946.0" font-size="16" text-anchor="middle">no</text><polyline points="195.0,1069.0 60,1069.0 60,53.0 195.0,53.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><text x="48" y="561.0" font-size="16" text-anchor="middle" transform="rotate(-90 48 561.0)">programma delle analisi: si ripete per ogni configurazione dell'elenco</text></svg>