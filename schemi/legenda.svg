<svg xmlns="http://www.w3.org/2000/svg" width="780" height="252" font-family="Helvetica, Arial, sans-serif"><defs><marker id="fr" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3.5 L0,7 z"/></marker></defs><rect x="1" y="1" width="778" height="250" rx="6" fill="#fff" stroke="#8c8c8c" stroke-width="1"/><text x="18" y="26.5" font-size="14" font-weight="bold">Legenda</text><rect x="22" y="39" width="56" height="26" rx="6" fill="#fff" stroke="#8c8c8c" stroke-width="1"/><text x="50.0" y="55.96" font-size="11" text-anchor="middle">N(i, j)</text><text x="92" y="56.5" font-size="13">stato del sistema (un nodo del grafo)</text><rect x="36" y="70" width="24" height="24" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="92" y="86.5" font-size="13">macchina (M1 o M2) vuota</text><rect x="36" y="100" width="24" height="24" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><circle cx="48" cy="112" r="4.5" fill="#000"/><text x="92" y="116.5" font-size="13">macchina con un pezzo in lavorazione</text><rect x="36" y="130" width="24" height="24" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="48.0" y="146.68" font-size="13" text-anchor="middle" font-weight="bold">B</text><text x="92" y="146.5" font-size="13">M1 bloccata con il pezzo finito (b nel par. 1.4)</text><line x1="38" y1="172" x2="58" y2="172" stroke="#000" stroke-width="2"/><text x="92" y="176.5" font-size="13">posto libero nel buffer</text><line x1="38" y1="202" x2="58" y2="202" stroke="#000" stroke-width="2"/><circle cx="48" cy="202" r="4.5" fill="#000"/><text x="92" y="206.5" font-size="13">posto occupato nel buffer</text><line x1="396" y1="52" x2="442" y2="52" stroke="#000" stroke-width="1.2" marker-end="url(#fr)"/><rect x="413.0" y="43.0" width="12" height="16" fill="#fff"/><text x="419.0" y="57.0" font-size="14" text-anchor="middle">λ</text><text x="474" y="56.5" font-size="13">arrivo di un pezzo</text><line x1="419" y1="69" x2="419" y2="95" stroke="#000" stroke-width="1.2" marker-end="url(#fr)"/><text x="448" y="86.5" font-size="14">μ</text><text x="474" y="86.5" font-size="13">fine lavorazione su M2, il pezzo esce</text><line x1="436" y1="123" x2="404" y2="101" stroke="#000" stroke-width="1.2" marker-end="url(#fr)"/><text x="448" y="116.5" font-size="14">μ</text><text x="474" y="116.5" font-size="13">fine lavorazione su M1, il pezzo passa a M2</text><line x1="419" y1="155" x2="419" y2="129" stroke="#000" stroke-width="1.2" marker-end="url(#fr)"/><text x="448" y="146.5" font-size="14">μ</text><text x="474" y="146.5" font-size="13">fine lavorazione su M1 con lato M2 pieno: blocco</text><line x1="436" y1="161" x2="404" y2="183" stroke="#000" stroke-width="1.2" marker-end="url(#fr)"/><text x="448" y="176.5" font-size="14">μ</text><text x="474" y="176.5" font-size="13">fine lavorazione su M2 che sblocca M1</text><rect x="404" y="200" width="32" height="14" rx="4" fill="#fff" stroke="#8c8c8c"/><path d="M412,200 C406,182 434,182 428,199" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#fr)"/><text x="474" y="206.5" font-size="13">cappio: il sistema resta nello stato</text><text x="18" y="236.5" font-size="12" font-style="italic">I cappi, cioè le transizioni di uno stato in se stesso, non sono disegnati nei diagrammi per semplicità di rappresentazione.</text></svg>