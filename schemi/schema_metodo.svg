<svg xmlns="http://www.w3.org/2000/svg" width="850" height="840" font-family="Helvetica, Arial, sans-serif"><defs><marker id="fr" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="130" y="30" width="200" height="64" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="230.0" y="46.95" font-size="17" text-anchor="middle">Modello di riferimento</text><text x="230.0" y="67.95" font-size="17" text-anchor="middle">(par. 1.4): due stazioni,</text><text x="230.0" y="88.95" font-size="17" text-anchor="middle">nessun buffer</text><text x="370" y="48" font-size="17">Risolto analiticamente: cinque stati.</text><text x="370" y="69" font-size="17">Con i buffer gli stati crescono</text><text x="370" y="90" font-size="17">e il calcolo va automatizzato</text><rect x="100" y="150" width="740" height="250" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="8 6"/><text x="836" y="142" font-size="18" text-anchor="end">Fase 1 – Costruzione e soluzione del modello (capitoli 3 e 4)</text><rect x="130" y="180" width="200" height="64" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="230.0" y="207.45" font-size="17" text-anchor="middle">Ipotesi e dati</text><text x="230.0" y="228.45" font-size="17" text-anchor="middle">λ, μ, K₁, K₂</text><rect x="370" y="180" width="200" height="64" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470.0" y="207.45" font-size="17" text-anchor="middle">Generazione degli stati</text><text x="470.0" y="228.45" font-size="17" text-anchor="middle">N(i, j) e B(i, K₂+1)</text><rect x="610" y="180" width="200" height="64" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="710.0" y="207.45" font-size="17" text-anchor="middle">Matrice generatrice Q</text><text x="710.0" y="228.45" font-size="17" text-anchor="middle">dalle regole di transizione</text><rect x="130" y="304" width="200" height="64" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="230.0" y="331.45" font-size="17" text-anchor="middle">Matrice di transizione</text><text x="230.0" y="352.45" font-size="17" text-anchor="middle">P(h) = I + Q h</text><rect x="370" y="304" width="200" height="64" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470.0" y="331.45" font-size="17" text-anchor="middle">Convergenza</text><text x="470.0" y="352.45" font-size="17" text-anchor="middle">p(n) = p(n−1) P(h) → π</text><rect x="610" y="304" width="200" height="64" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="710.0" y="320.95" font-size="17" text-anchor="middle">Indici di prestazione:</text><text x="710.0" y="341.95" font-size="17" text-anchor="middle">X, P<tspan baseline-shift="sub" font-size="12">rif</tspan>, P(M1 bloccata),</text><text x="710.0" y="362.95" font-size="17" text-anchor="middle">L, W</text><polyline points="230.0,94 230.0,180" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><polyline points="330,212.0 370,212.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><polyline points="570,212.0 610,212.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><polyline points="710.0,244 710.0,274 230.0,274 230.0,304" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><polyline points="330,336.0 370,336.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><polyline points="570,336.0 610,336.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><rect x="100" y="460" width="740" height="130" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="8 6"/><text x="104" y="452" font-size="18" text-anchor="start">Fase 2 – Verifica del modello implementato (capitolo 4)</text><rect x="130" y="493" width="320.0" height="64" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="290.0" y="509.95" font-size="17" text-anchor="middle">Quattro controlli a ogni esecuzione:</text><text x="290.0" y="530.95" font-size="17" text-anchor="middle">P(h) stocastica, irriducibilità,</text><text x="290.0" y="551.95" font-size="17" text-anchor="middle">πQ = 0, conservazione del flusso</text><rect x="490.0" y="493" width="320.0" height="64" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="650.0" y="509.95" font-size="17" text-anchor="middle">Confronto con i casi noti:</text><text x="650.0" y="530.95" font-size="17" text-anchor="middle">K₁ = K₂ = 0, soluzione analitica</text><text x="650.0" y="551.95" font-size="17" text-anchor="middle">con K₁ = 1, soluzione diretta di πQ = 0</text><line x1="660.4" y1="400" x2="660.4" y2="460" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><rect x="100" y="650" width="740" height="160" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="8 6"/><text x="104" y="642" font-size="18" text-anchor="start">Fase 3 – Uso del modello (capitoli 5 e 6)</text><rect x="130" y="683" width="320.0" height="94" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="290.0" y="704.45" font-size="17" text-anchor="middle">Analisi con il modello:</text><text x="290.0" y="725.45" font-size="17" text-anchor="middle">effetto di ogni buffer,</text><text x="290.0" y="746.45" font-size="17" text-anchor="middle">ripartizione di N posti,</text><text x="290.0" y="767.45" font-size="17" text-anchor="middle">posti per un obiettivo, carico</text><rect x="490.0" y="683" width="320.0" height="94" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="650.0" y="704.45" font-size="17" text-anchor="middle">Valutazione economica:</text><text x="650.0" y="725.45" font-size="17" text-anchor="middle">costo dei posti e dei pezzi</text><text x="650.0" y="746.45" font-size="17" text-anchor="middle">in attesa contro il ricavo</text><text x="650.0" y="767.45" font-size="17" text-anchor="middle">della produzione</text><line x1="660.4" y1="590" x2="660.4" y2="650" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><polyline points="450.0,730.0 490.0,730.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><polyline points="130,730.0 60,730.0 60,212.0 130,212.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#fr)"/><text x="46" y="478.5" font-size="17" text-anchor="middle" transform="rotate(-90 46 478.5)">per ogni configurazione si ripete il calcolo</text></svg>